<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>LMGame · Sanat Önizleme</title>
  <style>
    body { margin: 16px; font: 14px ui-monospace, Menlo, monospace; background: #6cc04a; color: #1b1423; }
    h2 { margin: 18px 0 6px; }
    .row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
    figure { margin: 0; text-align: center; }
    canvas { image-rendering: pixelated; background: #4a9a46; border: 1px dashed rgba(27,20,35,.4); }
    figcaption { font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Yapı, karakter ve simge önizlemesi</h1>
  <p>Geliştirme aracı: <code>python3 tools/serve.py</code> çalışırken <code>/tools/art-preview.html</code> adresinden açılır. Yapılar 5 kat büyütülmüş çizilir.</p>
  <div id="root"></div>
  <script type="module">
    import { getStructureSprite, getConstructionSiteSprite, getSheepFarmLayer, getSheepSprite, getRabbitSprite, getDeerSprite, getCatSprite, getDogSprite, getBoatSprite, getGazeboLayer } from '../src/art/sprites/index.js';
    import { getIconSprite, getBackpackSprite, getNoteSprite, getBubbleSprite, getHeldToolSprite, getCarrySprite } from '../src/art/ui/index.js';
    import { getCharacterSprite } from '../src/art/sprites/index.js';
    import { getTileSprite, getObjectSprite, getEdgeSprite } from '../src/art/tiles/index.js';
    import { TILE_TYPES } from '../src/data/tiles.js';

    const root = document.getElementById('root');
    const SCALE = 5;

    function show(title, items, scale = SCALE) {
      const h = document.createElement('h2');
      h.textContent = title;
      const row = document.createElement('div');
      row.className = 'row';
      for (const [label, sprite] of items) {
        const fig = document.createElement('figure');
        const c = document.createElement('canvas');
        c.width = sprite.width * scale;
        c.height = sprite.height * scale;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(sprite, 0, 0, c.width, c.height);
        const cap = document.createElement('figcaption');
        cap.textContent = `${label} (${sprite.width}x${sprite.height})`;
        fig.append(c, cap);
        row.append(fig);
      }
      root.append(h, row);
    }

    const SEASONS = ['spring', 'summer', 'autumn', 'winter'];
    const NAMES = { spring: 'ilkbahar', summer: 'yaz', autumn: 'sonbahar', winter: 'kış' };

    // --- 13. aşama: peyzaj, kasaba yadigârları, lüks mallar ve yeni arayüz simgeleri ---
    show('Kiraz Çiçeği Ağacı (1x1): ilkbahar, yaz, sonbahar, kış (yaprakları oyunda rüzgârla savrulur)', SEASONS.map((season) => [NAMES[season], getStructureSprite('cherryTree', { season })]), 6);
    show('Ahşap Çardak (2x2): tam görünüm, oyundaki iki katman (arka: döşeme ve banklar / ön: direkler ve çatı), kış', [
      ['çardak', getStructureSprite('gazebo', {})],
      ['arka katman', getGazeboLayer('back')],
      ['ön katman', getGazeboLayer('front')],
      ['kış', getStructureSprite('gazebo', { season: 'winter' })],
    ], 4);
    show('Mermer Kemer (1x1, altından geçilir) ve Çiçekli Çit (yanındakilerle birleşir)', [
      ['kemer', getStructureSprite('marbleArch', {})],
      ['kemer kış', getStructureSprite('marbleArch', { season: 'winter' })],
      ['çit tek', getStructureSprite('flowerFence', {})],
      ['sol uç', getStructureSprite('flowerFence', { connect: { right: true } })],
      ['orta', getStructureSprite('flowerFence', { connect: { left: true, right: true } })],
      ['sağ uç', getStructureSprite('flowerFence', { connect: { left: true } })],
      ['dikey', getStructureSprite('flowerFence', { connect: { up: true, down: true } })],
      ['köşe', getStructureSprite('flowerFence', { connect: { right: true, down: true } })],
      ['kış', getStructureSprite('flowerFence', { connect: { left: true, right: true }, season: 'winter' })],
    ], 6);
    show('Belediye Konağı ve kasaba yadigârları: hiç yok, iki yadigâr, dördü kaidelerde, Ebedi Ateş (turkuaz fenerler), gece', [
      ['yadigârsız', getStructureSprite('townHall', { frame: 1 })],
      ['küre + boynuz', getStructureSprite('townHall', { frame: 1, relics: 0b00011 })],
      ['dört yadigâr', getStructureSprite('townHall', { frame: 1, relics: 0b01111 })],

    show('Koyun Ağılı (3x3): tam görsel, oyundaki iki katman (arka / ön çit), mevsimler', [
      ...SEASONS.map((season) => [`ağıl ${NAMES[season]}`, getStructureSprite('sheepFarm', { season })]),
      ['arka katman', getSheepFarmLayer('back', 'summer')],
      ['ön katman', getSheepFarmLayer('front', 'summer')],

    show('Yel Değirmeni ve Fırın (3x3): kanatlar 6 karede çeyrek tur döner', [0, 1, 2, 3, 4, 5].map((f) => [`kanat ${f}`, getStructureSprite('mill', { sailFrame: f })]), 4);
    show('Değirmen: fırın yanıyor, gece, kış', [

      ['fırın alevi 1', getStructureSprite('mill', { sailFrame: 3, active: true, frame: 1 })],
      ['gece (pencere)', getStructureSprite('mill', { sailFrame: 4, windowsLit: true })],

    ], 4);
    show('Demir Madeni (3x3): boşta, vagon raylarda gidip gelir (çalışırken), gece feneri, kış', [
      ['boşta', getStructureSprite('ironMine', {})],
      ...[0, 1, 2, 3].map((f) => [`vagon ${f}`, getStructureSprite('ironMine', { active: true, frame: f })]),
      ['gece', getStructureSprite('ironMine', { lit: true })],
      ['kış', getStructureSprite('ironMine', { season: 'winter' })],
    ], 4);
    show('Belediye Konağı (3x3): bayrak dalgalanır, gece pencereler ve fenerler yanar, kış', [
      ...[0, 1, 2].map((f) => [`bayrak ${f}`, getStructureSprite('townHall', { frame: f })]),
      ['gece', getStructureSprite('townHall', { windowsLit: true, frame: 1 })],
      ['kış', getStructureSprite('townHall', { season: 'winter' })],
      ...[0, 1, 2].map((stage) => [`şantiye ${stage}`, getConstructionSiteSprite(3, 3, stage, 'townHall')]),
    ], 4);

    // --- 9. aşama: çocuklar, palto ve sırt çantası, balonlar, ekipman, Zanaat Atölyesi ---
    const looks = [
      { hair: 'long', hairColor: 'auburn', skin: 'light', shirt: 'rose', pants: 'navy' },
      { hair: 'spiky', hairColor: 'black', skin: 'medium', shirt: 'sky', pants: 'denim' },
      { hair: 'bun', hairColor: 'blonde', skin: 'deep', shirt: 'mustard', pants: 'plum' },
      { hair: 'short', hairColor: 'ginger', skin: 'tan', shirt: 'mint', pants: 'brown' },
    ];
    const CHILD = { child: true, coat: false, bag: false };
    show('Çocuklar (12x14): önden, nefes, yürüme, arkadan, yandan, oturma', looks.flatMap((a, i) => [
      [`çocuk ${i + 1}`, getCharacterSprite(a, 'down', 'idle0', CHILD)],
      ...(i === 0 ? [

    const COAT = { child: false, coat: true, bag: false };

    show('Kışlık palto ve sırt çantası (karakterin üstünde)', [
      ['palto yok', getCharacterSprite(looks[0], 'down', 'idle0')],
      ['palto önden', getCharacterSprite(looks[0], 'down', 'idle0', COAT)],

    show('Ekipman ve zanaat simgeleri', ['sturdyTool', 'winterCoat', 'backpack', 'anvil'].map((n) => [n, getIconSprite(n)]), 10);
    show('Eldeki aletler: normal ve Sağlam Alet', ['hammer', 'axe', 'pickaxe', 'hoe', 'rod'].flatMap((t) => [[t, getHeldToolSprite(t, false)], [`${t} sağlam`, getHeldToolSprite(t, false, true)]]), 8);
    show('Zanaat Atölyesi (3x2)', [

    /** Elle dizilmiş küçük bir karo haritası: biyom geçişleri oyundaki gibi (TileMap kuralı) çizilir. */
    function mosaic(rows, season) {
      const legend = { '.': 'grass', ',': 'meadow', '^': 'rocky', F: 'forest', '#': 'path', ':': 'sand', '~': 'water' };
      const h = rows.length;
      const w = rows[0].length;
      const canvas = document.createElement('canvas');
      canvas.width = w * 16;
      canvas.height = h * 16;
      const ctx = canvas.getContext('2d');
      const at = (x, y) => (rows[y] && rows[y][x] ? legend[rows[y][x]] : null);
      const offsets = [[0, -1], [1, 0], [0, 1], [-1, 0]];
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const name = at(x, y);
          ctx.drawImage(getTileSprite(name, (x * 3 + y) % 2, 0, season), x * 16, y * 16);
          const overlays = [].concat(TILE_TYPES[name].edgeOverlay ?? []);
          offsets.forEach(([dx, dy], dir) => {
            const n = at(x + dx, y + dy);
            if (season === 'winter' && n && TILE_TYPES[name].ground && TILE_TYPES[n].ground) return;
            const overlay = n && overlays.find((o) => o.neighbors.includes(n));
            if (overlay) ctx.drawImage(getEdgeSprite(overlay.sprite, dir, 0, season), x * 16, y * 16);
          });
        }
      }
      return canvas;
    }
    const PATCH = [
      '^^^^^...FFFF',
      '^^^^....FFFF',
      '^^^.....##FF',
      '..,,,,..#..F',
      '.,,,,,,.#...',
      ':,,,,,,,#,..',
      '~:,,,,,,#,,.',
    ];
    show('Biyom geçişleri (kayalık, çimen, orman, bereketli toprak, yol, kıyı)', SEASONS.map((s) => [NAMES[s], mosaic(PATCH, s)]), 3);

      ['Bahçe (donar)', getStructureSprite('garden', { season: 'winter' })],
      ['Derin Maden Ocağı', getStructureSprite('quarry', { level: 2, season: 'winter' })],

    show('Kadim harabeler: yıkık ve onarılmış', [
      ['Yıkık Gözetleme Kulesi', getStructureSprite('watchtower', { ruined: true })],
      ['Gözetleme Kulesi', getStructureSprite('watchtower', {})],
      ['gece, fener yanık', getStructureSprite('watchtower', { lit: true })],
      ['Terk Edilmiş Erzak Kampı', getStructureSprite('supplyCamp', { ruined: true })],
      ['Erzak Kampı', getStructureSprite('supplyCamp', {})],
      ['Kurumuş Kadim Çeşme', getStructureSprite('ancientFountain', { ruined: true })],
      ...[0, 1, 2, 3].map((frame) => [`Kadim Çeşme kare ${frame}`, getStructureSprite('ancientFountain', { frame })]),
    ], 5);
    show('Harabeler kışın', [
      ['yıkık kule', getStructureSprite('watchtower', { ruined: true, season: 'winter' })],
      ['kule', getStructureSprite('watchtower', { season: 'winter' })],
      ['yıkık kamp', getStructureSprite('supplyCamp', { ruined: true, season: 'winter' })],
      ['kamp', getStructureSprite('supplyCamp', { season: 'winter' })],
      ['kuru çeşme', getStructureSprite('ancientFountain', { ruined: true, season: 'winter' })],
      ['çeşme', getStructureSprite('ancientFountain', { season: 'winter' })],
    ], 4);
    // Mevsim önizlemesi: her mevsim için çimen karoları ve ağaçlar yan yana
    for (const season of SEASONS) {
      const tile = (name, v) => getTileSprite(name, v, 0, season);
      const oaks = season === 'autumn' ? [0, 1, 2].map((v) => [`meşe ${v}`, getObjectSprite('oak', season, v)]) : [['meşe', getObjectSprite('oak', season)]];
      show(`Mevsim: ${NAMES[season]}`, [
        ['çimen', tile('grass', 0)],
        ['çiçekli', tile('grass', 1)],
        ['taşlı', tile('grass', 2)],
        ...oaks,
        ['çam', getObjectSprite('pine', season)],
        ['fidan', getObjectSprite('sapling', season)],
        ['kaya', getObjectSprite('rock', season)],
        ['çalı', getStructureSprite('berryBush', { berries: 3, maxBerries: 3, season })],
      ], 4);
    }
    show('Mevsimlik yapılar', [
      ...SEASONS.map((season) => [`bahçe ${NAMES[season]}`, getStructureSprite('garden', { season })]),
      ['kulübe kış', getStructureSprite('cabin', { season: 'winter', tone: 0 })],
      ['kulübe (mavi çatı) kış', getStructureSprite('cabin', { season: 'winter', tone: 1 })],
      ['han kış', getStructureSprite('inn', { season: 'winter' })],
      ['kiler kış', getStructureSprite('storage', { season: 'winter' })],
    ], 3);
    show('Süsleme ve prestij (7. aşama)', [
      ['taş yol', getTileSprite('cobble', 0, 0)],
      ['toprak yol', getTileSprite('path', 0, 0)],
      ['fener gündüz', getStructureSprite('lantern', { lit: false })],
      ['fener gece', getStructureSprite('lantern', { lit: true })],
      ['anıt', getStructureSprite('monument', {})],
      ['anıt kış', getStructureSprite('monument', { season: 'winter' })],
    ], 5);
    show('Taş ocağı', [
      ['kare 0', getStructureSprite('quarry', { active: false })],
      ['kare 1 (vinç sallanır)', getStructureSprite('quarry', { active: true, frame: 1 })],
    ]);
    show('Balıkçı iskelesi', [
      ['gündüz, su sağda', getStructureSprite('fishingPier', { lit: false })],
      ['gece, fener yanık', getStructureSprite('fishingPier', { lit: true })],
      ['su solda', getStructureSprite('fishingPier', { lit: false, orientation: 'left' })],
    ]);
    show('İskele şantiyesi', [0, 1, 2].map((stage) => ['aşama ' + stage, getConstructionSiteSprite(2, 2, stage, 'fishingPier')]));
    show('Kasaba Hanı', [
      ['gündüz', getStructureSprite('inn', { lit: false, frame: 0 })],
      ['gece, tabela sağa', getStructureSprite('inn', { lit: true, frame: 1 })],
      ['tabela sola', getStructureSprite('inn', { lit: true, frame: 3 })],
    ]);
    show('Pazar Yeri', [
      ['tüccar yok', getStructureSprite('market', { open: false })],
      ['tüccar geldi, flama 0', getStructureSprite('market', { open: true, frame: 0 })],
      ['flama 1', getStructureSprite('market', { open: true, frame: 1 })],
    ]);
    show('Çiçek tarhı', [0, 1, 2].flatMap((tone) => [0, 1].map((frame) => [`renk ${tone} kare ${frame}`, getStructureSprite('flowerBed', { tone, frame })])));
    const merchantLook = { hair: 'bun', hairColor: 'gray', skin: 'light', shirt: 'teal', pants: 'plum' };
    show('Gezgin tüccar ve şenlik', [
      ['tüccar', getCharacterSprite(merchantLook, 'down', 'idle0')],
      ['çanta önden', getBackpackSprite('front')],
      ['çanta arkadan', getBackpackSprite('back')],
      ['çanta yandan', getBackpackSprite('right')],
      ...['P', 'p', 'i', 'a', 'O'].map((c) => [`nota ${c}`, getNoteSprite(c)]),
    ], 8);
    show('HUD simgeleri', ['wood', 'stone', 'food', 'wool', 'iron', 'bread', 'sound', 'mute', 'smile', 'frown', 'coin', 'spring', 'summer', 'autumn', 'winter', 'snow', 'star', 'starEmpty'].map((n) => [n, getIconSprite(n)]), 10);
    show('Hava simgeleri', ['sun', 'cloud', 'rain', 'firefly', 'moon', 'journal'].map((n) => [n, getIconSprite(n)]), 10);
  </script>
</body>
</html>
