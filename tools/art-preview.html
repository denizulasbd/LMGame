<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>LMGame · Sanat Önizleme</title>
  <style>
    body { margin: 16px; font: 14px ui-monospace, Menlo, monospace; background: #6cc04a; color: #1b1423; }
    h2 { margin: 18px 0 6px; }
    .row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
    figure { margin: 0; text-align: center; }
    canvas { image-rendering: pixelated; background: #4a9a46; border: 1px dashed rgba(27,20,35,.4); }
    figcaption { font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Yapı, karakter ve simge önizlemesi</h1>
  <p>Geliştirme aracı: <code>python3 tools/serve.py</code> çalışırken <code>/tools/art-preview.html</code> adresinden açılır. Yapılar 5 kat büyütülmüş çizilir.</p>
  <div id="root"></div>
  <script type="module">
    import { getTradeShipSprite, getCaravanSprite } from '../src/art/sprites/index.js';
    import { getStructureSprite, getConstructionSiteSprite, getSheepFarmLayer, getSheepSprite, getRabbitSprite, getDeerSprite, getCatSprite, getDogSprite, getBoatSprite, getGazeboLayer, getFestivalDecorSprite, getFlowerCrownSprite } from '../src/art/sprites/index.js';
    import { getIconSprite, getBackpackSprite, getNoteSprite, getBubbleSprite, getHeldToolSprite, getCarrySprite } from '../src/art/ui/index.js';
    import { getCharacterSprite } from '../src/art/sprites/index.js';
    import { getTileSprite, getObjectSprite, getEdgeSprite } from '../src/art/tiles/index.js';
    import { TILE_TYPES } from '../src/data/tiles.js';
    import { TileMap } from '../src/world/TileMap.js';
    import { WeddingConfetti } from '../src/rendering/WeddingConfetti.js';
    import { ChimeWaves } from '../src/rendering/ChimeWaves.js';
    import { QUIRKS } from '../src/data/social.js';
    import { getStoolSprite } from '../src/art/ui/index.js';
    import { PROFESSIONS } from '../src/data/apprenticeship.js';
    import { HEIRLOOMS } from '../src/data/heirloom.js';
    import { FairDecor } from '../src/rendering/FairDecor.js';
    import { FAIRS, FAIR_TYPES } from '../src/data/fair.js';

    const root = document.getElementById('root');
    const SCALE = 5;

    function show(title, items, scale = SCALE) {
      const h = document.createElement('h2');
      h.textContent = title;
      const row = document.createElement('div');
      row.className = 'row';
      for (const [label, sprite] of items) {
        const fig = document.createElement('figure');
        const c = document.createElement('canvas');
        c.width = sprite.width * scale;
        c.height = sprite.height * scale;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(sprite, 0, 0, c.width, c.height);
        const cap = document.createElement('figcaption');
        cap.textContent = `${label} (${sprite.width}x${sprite.height})`;
        fig.append(c, cap);
        row.append(fig);
      }
      root.append(h, row);
    }

    const SEASONS = ['spring', 'summer', 'autumn', 'winter'];
    const NAMES = { spring: 'ilkbahar', summer: 'yaz', autumn: 'sonbahar', winter: 'kış' };

    // --- 26.1: Mevsimlik Panayır — meydan havuzunun çevresinde geçici tentler, flamalar ve mevsim süsleri (hazırlık / şenlik saati) ---
    {
      const decor = new FairDecor();
      const fountain = getStructureSprite('fountain', {});
      const W = 170;
      const H = 120;
      const fx = Math.round((W - fountain.width) / 2);
      const fy = Math.round((H - fountain.height) / 2) + 6;
      const venue = { x: fx, y: fy, width: fountain.width, height: fountain.height, type: 'fountain' };
      const looks = [
        { hair: 'short', hairColor: 'brown', skin: 'light', shirt: 'rose', pants: 'navy' },
        { hair: 'long', hairColor: 'black', skin: 'tan', shirt: 'sky', pants: 'brown' },
        { hair: 'bun', hairColor: 'gray', skin: 'light', shirt: 'lavender', pants: 'plum' },
      ];
      const frames = [];
      for (const phase of ['prep', 'party']) {
        for (const type of FAIR_TYPES) {
          const people = phase === 'party'
            ? [[getCharacterSprite(looks[0], 'down', 'idle0'), fx - 8, fy + fountain.height + 8], [getCharacterSprite(looks[1], 'down', 'idle1'), fx + fountain.width + 4, fy + fountain.height + 4], [getCharacterSprite(looks[2], 'down', 'idle0', { child: false, coat: false, bag: false, outfit: null, stage: 'elder' }), fx + fountain.width / 2, fy + fountain.height + 12]]
            : [];
          frames.push([`${FAIRS[type].name} · ${phase === 'prep' ? 'hazırlık 06:00 - 18:00' : 'şenlik 18:00 - 22:00'}`, scene(W, H, [[fountain, fx, fy + fountain.height], ...people], (ctx) => {
            const r = { fillRect: (x, y, w, h, color) => { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); } };
            decor.draw(r, venue, 1.0, type, phase);
            if (phase === 'party') { ctx.fillStyle = 'rgba(20, 16, 50, 0.22)'; ctx.fillRect(0, 0, W, H); decor.draw(r, venue, 1.0, type, phase); }
          })]);
        }
      }
      show('Mevsimlik Panayır (26.1): meydan havuzu çevresinde tentler ve flamalar (üstte hazırlık), şenlik saatinde ilkbaharda çiçek çelenkleri, yazın güneş fenerleri, sonbaharda hasat sepetleri, kışın meşale ve ateş (altta). Harita matrisine hiçbir şey yazılmaz', frames, 3);
    }

    // --- 25.5: aile yadigârları ve törensel devir teslim ---
    {
      const look = (extra) => ({ child: false, coat: false, bag: false, outfit: null, stage: null, ...extra });
      const kinds = ['heirloomHammer', 'heirloomShuttle', 'heirloomCompass', 'heirloomYeast', 'heirloomTrowel', 'heirloomJournal'];
      const framed = (name) => {
        const icon = getIconSprite(name);
        const c = document.createElement('canvas');
        c.width = 15;
        c.height = 15;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#e0a030';
        ctx.fillRect(0, 0, 15, 15);
        ctx.fillStyle = '#fff3b0';
        ctx.fillRect(1, 1, 13, 13);
        ctx.fillStyle = '#ffd23f';
        ctx.fillRect(2, 2, 11, 11);
        ctx.drawImage(icon, 3, 3);
        return c;
      };
      show('Aile yadigârları (25.5): satılmaz, feda edilmez, yok edilmez — çantada parıldayan altın çerçeve', kinds.map((k) => [HEIRLOOMS[k].name, framed(k)]), 8);
      const elderP = { hair: 'short', hairColor: 'gray', skin: 'tan', shirt: 'forest', pants: 'brown' };
      const heirP = { hair: 'spiky', hairColor: 'ginger', skin: 'light', shirt: 'sky', pants: 'denim' };
      const say = (ctx, text, cx, top) => {
        ctx.font = "7px 'Pixelify Sans', monospace";
        const w = Math.ceil(ctx.measureText(text).width) + 6;
        cx = Math.max(w / 2 + 2, Math.min(ctx.canvas.width - w / 2 - 2, cx));
        ctx.fillStyle = '#1b1423';
        ctx.fillRect(cx - w / 2 - 1, top - 1, w + 2, 11);
        ctx.fillStyle = '#fff8e7';
        ctx.fillRect(cx - w / 2, top, w, 9);
        ctx.fillStyle = '#3a2a1f';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, cx - w / 2 + 3, top + 5);
      };
      const frames = [0, 1, 2].map((i) => {
        const item = getIconSprite('heirloomHammer');
        const ix = 58 + i * 10;
        return [`devir ${i}`, scene(210, 64, [
          [getCharacterSprite(elderP, 'right', 'idle0', look({ stage: 'elder' })), 50, 58],
          [getCharacterSprite(heirP, 'left', i === 2 ? 'idle1' : 'idle0', look({ stage: 'youth' })), 88, 58],
          [item, ix, 46],
        ], (ctx) => {
          if (i < 2) say(ctx, 'Bu çekiç artık senin evlat, hakkını ver!', 60, 4);
          else say(ctx, 'Söz veriyorum, layık olacağım!', 94, 4);
          if (i === 2) for (let k = 0; k < 6; k++) { ctx.fillStyle = ['#ffd23f', '#f06b8a', '#8a6cf0'][k % 3]; ctx.fillRect(84 + k * 4, 20 + (k % 2) * 3, 1, 1); }
        })];
      });
      show('Törensel devir teslim: Kıdemli Bilge yadigârını evladına uzatır; veda ve söz (metin baloncuğu), ilk devirde Kuşak Şöleni', frames, 4);
    }

    // --- 25.4: Aile Kütüğü — üç kuşaklık soy ağacı, Yeni Yuva ve Ocak Devri ---
    {
      const look = (extra) => ({ child: false, coat: false, bag: false, outfit: null, stage: null, ...extra });
      const A = { hair: 'bun', hairColor: 'gray', skin: 'light', shirt: 'lavender', pants: 'plum' };
      const B = { hair: 'short', hairColor: 'brown', skin: 'light', shirt: 'forest', pants: 'brown' };
      const C1 = { hair: 'long', hairColor: 'brown', skin: 'light', shirt: 'rose', pants: 'navy' };
      const C2 = { hair: 'spiky', hairColor: 'ginger', skin: 'tan', shirt: 'sky', pants: 'denim' };
      const K = { hair: 'short', hairColor: 'ginger', skin: 'light', shirt: 'mustard', pants: 'navy' };
      const tree = scene(200, 112, [
        [getCharacterSprite(A, 'down', 'idle0', look({ stage: 'elder' })), 54, 30],
        [getCharacterSprite(B, 'down', 'idle0', look({})), 84, 30],
        [getBubbleSprite('heart'), 69, 14],
        [getCharacterSprite(C1, 'down', 'idle0', look({ stage: 'youth' })), 54, 70],
        [getCharacterSprite(C2, 'down', 'idle0', look({})), 84, 70],
        [getBubbleSprite('ring'), 69, 54],
        [getCharacterSprite(K, 'down', 'idle0', look({ child: true })), 69, 106],
      ], (ctx) => {
        ctx.fillStyle = '#ffd23f';
        ctx.fillRect(66, 31, 18, 1); // eşler
        ctx.fillRect(75, 31, 1, 12);
        ctx.fillRect(60, 42, 16, 1); // çocuğuna
        ctx.fillRect(60, 42, 1, 8);
        ctx.fillRect(66, 71, 18, 1);
        ctx.fillRect(75, 71, 1, 18);
        ctx.font = "7px 'Pixelify Sans', monospace";
        ctx.fillStyle = '#1b1423';
        ctx.fillText('1. Kuşak Kurucu', 98, 22);
        ctx.fillText('2. Kuşak Kasabalı', 98, 62);
        ctx.fillText('3. Kuşak Torun', 98, 100);
      });
      const cabin = getStructureSprite('cabin', { tone: 1 });
      const home = scene(cabin.width + 64, cabin.height + 22, [
        [cabin, 4, cabin.height + 4],
        [getCharacterSprite(C1, 'right', 'walk0', look({ stage: 'youth' })), cabin.width + 14, cabin.height + 18],
        [getCharacterSprite(C2, 'left', 'walk1', look({})), cabin.width + 30, cabin.height + 18],
        [getBubbleSprite('love'), cabin.width + 22, cabin.height + 1],
      ]);
      show('Aile Kütüğü (25.4): üç kuşaklık soy ağacı; evlenen 2. kuşak çift boş kulübeye "Yeni Yuva" kurar', [['soy ağacı', tree], ['Yeni Yuva', home]], 4);
    }

    // --- 25.3: yeni nesil huylar — rozetler, karakter portreleri ve mizaç sahneleri ---
    {
      const look = (extra) => ({ child: false, coat: false, bag: false, outfit: null, stage: null, ...extra });
      const keys = ['craftsman', 'entrepreneur', 'philosopher', 'festive'];
      show('Yeni nesil huylar (25.3): Zanaatkâr Ruhu, Girişimci Kanı, Bilge Düşünür, Şenlik Neşesi — rozet simgeleri', keys.map((k) => [QUIRKS[k].name, getIconSprite(QUIRKS[k].icon)]), 10);
      const folks = {
        craftsman: [{ hair: 'short', hairColor: 'brown', skin: 'tan', shirt: 'forest', pants: 'brown' }, { outfit: 'lumberjack:2' }, 'Elimin emeği, gönlümün işi.'],
        entrepreneur: [{ hair: 'bun', hairColor: 'black', skin: 'light', shirt: 'mustard', pants: 'navy' }, { bag: true }, 'Ucuza al, değerinde sat!'],
        philosopher: [{ hair: 'long', hairColor: 'auburn', skin: 'medium', shirt: 'lavender', pants: 'plum' }, {}, 'Bilmek, iki kere yaşamaktır.'],
        festive: [{ hair: 'spiky', hairColor: 'ginger', skin: 'light', shirt: 'rose', pants: 'denim' }, { stage: 'youth' }, 'Haydi bir şerbet içelim!'],
      };
      const portrait = (k) => {
        const [app, extra, line] = folks[k];
        return scene(150, 52, [[getCharacterSprite(app, 'down', 'idle0', look(extra)), 69, 48], [getIconSprite(QUIRKS[k].icon), 84, 34]], (ctx) => {
          ctx.font = "7px 'Pixelify Sans', monospace";
          const w = Math.ceil(ctx.measureText(line).width) + 6;
          const x = Math.round(75 - w / 2);
          ctx.fillStyle = '#1b1423';
          ctx.fillRect(x - 1, 3, w + 2, 11);
          ctx.fillStyle = '#fff8e7';
          ctx.fillRect(x, 4, w, 9);
          ctx.fillRect(74, 13, 2, 2);
          ctx.fillStyle = '#3a2a1f';
          ctx.textBaseline = 'middle';
          ctx.fillText(line, x + 3, 9);
        });
      };
      show('Mizaç portreleri ve sözleri (metin baloncuğu): her yeni huy kendi sözünü söyler', keys.map((k) => [QUIRKS[k].name, portrait(k)]), 4);
      const fountain = getStructureSprite('fountain', {});
      const dance = [0, 1, 2].map((i) => {
        const [app] = folks.festive;
        return [`dans ${i}`, scene(96, 64, [[fountain, 48 - fountain.width / 2, 40], [getCharacterSprite(app, i % 2 ? 'left' : 'right', 'idle' + (i % 2), look({ stage: 'youth' })), 40, 60], [getCharacterSprite(folks.philosopher[0], 'left', 'idle0', look({})), 64, 60], [getBubbleSprite(i === 1 ? 'note' : 'heart'), 66, 44]])];
      });
      show('Şenlik Neşesi meydan havuzunda dans eder (sağa sola döner), yanındakilerin neşesi yükselir', dance, 4);
    }

    // --- 25.2: Usta-Çırak — usta tezgâhta çalışırken çırak yanındaki taburede izler; ikisi konuşur (metin baloncuğu) ---
    {
      const look = (extra) => ({ child: false, coat: false, bag: false, outfit: null, stage: null, ...extra });
      const masterP = { hair: 'short', hairColor: 'black', skin: 'tan', shirt: 'forest', pants: 'brown' };
      const pupilP = { hair: 'spiky', hairColor: 'ginger', skin: 'light', shirt: 'sky', pants: 'denim' };
      const bubble = (ctx, text, cx, top) => {
        ctx.font = "7px 'Pixelify Sans', monospace";
        const w = Math.ceil(ctx.measureText(text).width) + 6;
        cx = Math.max(w / 2 + 2, Math.min(ctx.canvas.width - w / 2 - 2, cx));
        ctx.fillStyle = '#1b1423';
        ctx.fillRect(cx - w / 2 - 1, top - 1, w + 2, 11);
        ctx.fillStyle = '#fff8e7';
        ctx.fillRect(cx - w / 2, top, w, 9);
        ctx.fillRect(cx - 1, top + 9, 2, 2);
        ctx.fillStyle = '#3a2a1f';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, cx - w / 2 + 3, top + 5);
      };
      const shop = (type, tool, frame, lines) => {
        const b = getStructureSprite(type, {});
        const w = Math.max(150, b.width + 70);
        const h = b.height + 34;
        const kit = frame ? 'idle1' : 'idle0';
        return scene(w, h, [
          [b, 4, b.height + 8],
          [getCharacterSprite(masterP, 'right', kit, look({ outfit: 'lumberjack:3' })), b.width + 8, h - 4],
          [getHeldToolSprite(tool, false), b.width + 14, h - 10 + (frame ? 4 : 0)],
          [getStoolSprite(), b.width + 31, h - 2],
          [getCharacterSprite(pupilP, 'down', frame ? 'sit1' : 'sit0', look({ stage: 'youth' })), b.width + 29, h - 5],
        ], (ctx) => {
          if (lines[0]) bubble(ctx, lines[0], b.width + 14, 2);
          if (lines[1]) bubble(ctx, lines[1], b.width + 34, 14);
        });
      };
      show('Usta-Çırak (25.2): usta tezgâhta çalışırken çırak yanındaki taburede izler ve getir-götür işlerine bakar; ikisi konuşur', [
        ['oduncu kulübesi, kare 0', shop('lumberHut', 'axe', 0, [PROFESSIONS.lumberHut.lines.master[1], null])],
        ['kare 1 (balta iner)', shop('lumberHut', 'axe', 1, [null, PROFESSIONS.lumberHut.lines.apprentice[0]])],
        ['dokuma tezgâhı', shop('loom', 'shuttle', 0, [null, PROFESSIONS.loom.lines.apprentice[1]])],
        ['fırın', shop('mill', 'peel', 1, [PROFESSIONS.mill.lines.master[1], null])],
      ], 4);
      show('Çırak taburesi (8x4) ve çırak işleri', [
        ['tabure', getStoolSprite()],
        ...['anvil', 'wood', 'herb', 'bread', 'cloth', 'sherbet'].map((n) => [n, getIconSprite(n)]),
      ], 8);
    }

    // --- 25.1: yaşam evreleri — Çocuk (küçük silüet), Genç (turuncu fular), Yetişkin (standart), Kıdemli Bilge (kır saç + baston) ---
    {
      const people = [
        { hair: 'short', hairColor: 'brown', skin: 'light', shirt: 'sky', pants: 'navy' },
        { hair: 'long', hairColor: 'auburn', skin: 'tan', shirt: 'rose', pants: 'denim' },
        { hair: 'bun', hairColor: 'black', skin: 'dark', shirt: 'mint', pants: 'plum' },
        { hair: 'hat', hairColor: 'ginger', skin: 'light', shirt: 'red', pants: 'denim' },
      ];
      const STAGES = [['Çocuk', { child: true }], ['Genç', { stage: 'youth' }], ['Yetişkin', {}], ['Kıdemli Bilge', { stage: 'elder' }]];
      const look = (extra) => ({ child: false, coat: false, bag: false, outfit: null, stage: null, ...extra });
      show('Yaşam evreleri (25.1): aynı sakinin dört evresi, önden', people.slice(0, 2).flatMap((p, i) => STAGES.map(([name, l]) => [`${i + 1}. ${name}`, getCharacterSprite(p, 'down', 'idle0', look(l))])), 6);
      show('Kıdemli Bilge: kırlaşmış saç ve şakaklar, ahşap yürüyüş bastonu (otururken bırakır); her saç stili ve yön', [
        ...people.map((p) => [`${p.hair} önden`, getCharacterSprite(p, 'down', 'idle0', look({ stage: 'elder' }))]),
        ['yandan yürüyüş 0', getCharacterSprite(people[0], 'right', 'walk0', look({ stage: 'elder' }))],
        ['yandan yürüyüş 1', getCharacterSprite(people[0], 'left', 'walk1', look({ stage: 'elder' }))],
        ['arkadan', getCharacterSprite(people[1], 'up', 'idle0', look({ stage: 'elder' }))],
        ['bankta oturuyor', getCharacterSprite(people[2], 'down', 'sit0', look({ stage: 'elder' }))],
        ['paltolu (kış)', getCharacterSprite(people[3], 'down', 'idle1', look({ stage: 'elder', coat: true }))],
      ], 6);
      show('Genç: boynunda turuncu fular (çevik duruş); yönler ve çanta', [
        ['önden', getCharacterSprite(people[2], 'down', 'idle0', look({ stage: 'youth' }))],
        ['yandan koşuyor', getCharacterSprite(people[2], 'right', 'walk0', look({ stage: 'youth' }))],
        ['arkadan', getCharacterSprite(people[2], 'up', 'idle0', look({ stage: 'youth' }))],
        ['sırt çantalı', getCharacterSprite(people[0], 'down', 'idle0', look({ stage: 'youth', bag: true }))],
      ], 6);
      const gazebo = getStructureSprite('gazebo', {});
      const bench = getStructureSprite('bench', {});
      show('Bilge Nasihati: emekli bilge çardakta / bankta oturur, yanındaki gençlerin ve yetişkinlerin morali dolar', [
        ['çardakta nasihat', scene(Math.max(120, gazebo.width + 70), gazebo.height + 20, [[gazebo, 4, gazebo.height + 10], [getCharacterSprite(people[0], 'down', 'sit0', look({ stage: 'elder' })), gazebo.width / 2 - 2, gazebo.height + 4], [getBubbleSprite('book'), gazebo.width / 2 - 1, gazebo.height - 14], [getCharacterSprite(people[1], 'left', 'idle0', look({ stage: 'youth' })), gazebo.width + 22, gazebo.height + 14], [getBubbleSprite('sparkle'), gazebo.width + 23, gazebo.height - 4], [getCharacterSprite(people[2], 'left', 'idle1', look({})), gazebo.width + 42, gazebo.height + 14]])],
        ['bankta', scene(Math.max(80, bench.width + 50), 48, [[bench, 10, 40], [getCharacterSprite(people[3], 'down', 'sit1', look({ stage: 'elder' })), 12, 38], [getCharacterSprite(people[1], 'left', 'idle0', look({ child: true })), bench.width + 24, 42]])],
      ], 4);
    }

    // --- 24.3: dış ticaret — Ticaret İskelesi / Kervan Konağı, Ticaret Gemisi, Kervan ve ihracat sözleşmesi kartı ---
    {
      show('Ticaret İskelesi / Kervan Konağı (3x2): taş temel, ahşap ambar, çizgili tente, sikkeli tabela, terazi, sandık ve balyalar', [
        ['boş', getStructureSprite('tradingPost', {})],
        ['gemi / kervan burada (flamalar)', getStructureSprite('tradingPost', { docked: true })],
        ['gece (fener)', getStructureSprite('tradingPost', { lit: true, docked: true })],
        ['kış', getStructureSprite('tradingPost', { season: 'winter' })],
        ['şantiye', getConstructionSiteSprite(3, 2, 1, 'tradingPost')],
      ], 5);
      show('Ticaret Gemisi (suya bakan yana göre aynalanır; gece kamara pencereleri ve kıç feneri yanar) ve Kervan', [
        ['gemi (sağda su)', getTradeShipSprite(false, false)],
        ['gemi (solda su, gece)', getTradeShipSprite(true, true)],
        ['kervan', getCaravanSprite(false)],
        ['kervan (aynalı)', getCaravanSprite(true)],
      ], 5);
      // İskele sahnesi: nehir kıyısında demirli gemi; yol kenarında çadırlı kervan
      const post = getStructureSprite('tradingPost', { docked: true });
      const river = scene(112, 64, [[post, 4, 60], [getTradeShipSprite(false, false), 56, 62]], (ctx) => {
        ctx.fillStyle = '#2f6fb5';
        ctx.fillRect(52, 30, 60, 34);
        ctx.fillStyle = '#4aa3df';
        for (let x = 56; x < 112; x += 9) ctx.fillRect(x, 40 + (x % 3) * 6, 4, 1);
        ctx.drawImage(post, 4, 60 - post.height);
        const ship = getTradeShipSprite(false, false);
        ctx.drawImage(ship, 56, 62 - ship.height);
      });
      const road = scene(112, 64, [], (ctx) => {
        ctx.fillStyle = '#a8754a';
        ctx.fillRect(0, 52, 112, 12);
        ctx.drawImage(post, 4, 52 - post.height);
        const car = getCaravanSprite(false);
        ctx.drawImage(car, 58, 62 - car.height);
      });
      show('Dış ticaret sahneleri: nehir kıyısında iskele ve demirli gemi; yol kenarında konak ve kervan', [['iskele', river], ['kervan konağı', road]], 4);

    /** Gerçek TileMap kuralıyla (kenar geçişleri + otomatik yol köşeleri, isteğe bağlı çamur) çizilen küçük harita. */
    function roadMosaic(rows, season = 'summer', wet = false) {
      const legend = { '.': 'grass', ',': 'meadow', F: 'forest', '#': 'path', '=': 'cobble', P: 'plaza', ':': 'sand' };
      const map = new TileMap(rows[0].length, rows.length);
      rows.forEach((row, y) => [...row].forEach((ch, x) => map.set(x, y, legend[ch], (x * 3 + y) % 2)));
      const canvas = document.createElement('canvas');
      canvas.width = map.width * 16;
      canvas.height = map.height * 16;
      const ctx = canvas.getContext('2d');
      const renderer = { width: canvas.width, height: canvas.height, drawImage: (img, x, y) => ctx.drawImage(img, x, y) };
      const camera = { getViewBounds: () => ({ left: 0, top: 0, right: canvas.width, bottom: canvas.height }) };
      map.renderGround(renderer, camera, 0, season, { wet });
      return canvas;
    }
    const ROADS = [
      '..........,,,,',
      '.####.....,,,,',
      '.#..#######,,,',
      '.#..#..=..#,,,',
      '.####..=..#...',
      '....#==PPP=====',
      '....#..PPP#...F',
      '....#..PPP#..FF',
      '.......=..#.FFF',
    ].map((r) => r.slice(0, 15).padEnd(15, '.'));
    show('Yol & Zemin fırçası: toprak patika, parke taş yol ve taş plaka meydan; virajlar ve kavşaklar otomatik köşelenir (yaz, sonbahar, kış)', ['summer', 'autumn', 'winter'].map((sn) => [NAMES[sn], roadMosaic(ROADS, sn)]), 3);
    show('Yağmurda toprak patika çamurlanır (parke ve taş plaka çamurlanmaz)', [['kuru', roadMosaic(ROADS.slice(0, 6))], ['yağmurda', roadMosaic(ROADS.slice(0, 6), 'summer', true)]], 3);

    ], 5);
    /** Çit düzeni: her çit dört yanındaki çite / kapıya göre birleşir (StructureSystem.connectFences kuralı). */
    function fenceLayout(rows) {
      const h = rows.length;
      const w = rows[0].length;
      const canvas = document.createElement('canvas');
      canvas.width = w * 16;
      canvas.height = h * 16 + 8;
      const ctx = canvas.getContext('2d');
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) ctx.drawImage(getTileSprite('grass', 0, 0), x * 16, y * 16 + 8);
      const isFence = (x, y) => rows[y] && (rows[y][x] === 'f' || rows[y][x] === 'g');
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const ch = rows[y][x];
          if (ch !== 'f' && ch !== 'g') continue;
          const connect = { left: isFence(x - 1, y), right: isFence(x + 1, y), up: isFence(x, y - 1), down: isFence(x, y + 1) };
          const sprite = getStructureSprite(ch === 'f' ? 'woodFence' : 'fenceGate', { connect });
          ctx.drawImage(sprite, x * 16, (y + 1) * 16 + 8 - sprite.height);
        }
      }
      return canvas;
    }
    show('Ahşap Çit ve Çit Kapısı: yönüne göre birleşir (köşe, T, dört yol); kapı çitin yönünü alır', [

    /** Elle dizilmiş küçük bir karo haritası: biyom geçişleri oyundaki gibi (TileMap kuralı) çizilir. */
    function mosaic(rows, season) {
      const legend = { '.': 'grass', ',': 'meadow', '^': 'rocky', F: 'forest', '#': 'path', ':': 'sand', '~': 'water' };
      const h = rows.length;
      const w = rows[0].length;
      const canvas = document.createElement('canvas');
      canvas.width = w * 16;
      canvas.height = h * 16;
      const ctx = canvas.getContext('2d');
      const at = (x, y) => (rows[y] && rows[y][x] ? legend[rows[y][x]] : null);
      const offsets = [[0, -1], [1, 0], [0, 1], [-1, 0]];
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const name = at(x, y);
          ctx.drawImage(getTileSprite(name, (x * 3 + y) % 2, 0, season), x * 16, y * 16);
          const overlays = [].concat(TILE_TYPES[name].edgeOverlay ?? []);
          offsets.forEach(([dx, dy], dir) => {
            const n = at(x + dx, y + dy);
            if (season === 'winter' && n && TILE_TYPES[name].ground && TILE_TYPES[n].ground) return;
            const overlay = n && overlays.find((o) => o.neighbors.includes(n));
            if (overlay) ctx.drawImage(getEdgeSprite(overlay.sprite, dir, 0, season), x * 16, y * 16);
          });
        }
      }
      return canvas;
    }

      '^^^.....##FF',
