<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>LMGame · Sanat Önizleme</title>
  <style>
    body { margin: 16px; font: 14px ui-monospace, Menlo, monospace; background: #6cc04a; color: #1b1423; }
    h2 { margin: 18px 0 6px; }
    .row { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
    figure { margin: 0; text-align: center; }
    canvas { image-rendering: pixelated; background: #4a9a46; border: 1px dashed rgba(27,20,35,.4); }
    figcaption { font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Yapı, karakter ve simge önizlemesi</h1>
  <p>Geliştirme aracı: <code>python3 tools/serve.py</code> çalışırken <code>/tools/art-preview.html</code> adresinden açılır. Yapılar 5 kat büyütülmüş çizilir.</p>
  <div id="root"></div>
  <script type="module">
    import { getStructureSprite, getConstructionSiteSprite, getSheepFarmLayer, getSheepSprite, getRabbitSprite, getDeerSprite, getCatSprite, getDogSprite, getBoatSprite, getGazeboLayer, getFestivalDecorSprite, getFlowerCrownSprite } from '../src/art/sprites/index.js';
    import { getIconSprite, getBackpackSprite, getNoteSprite, getBubbleSprite, getHeldToolSprite, getCarrySprite } from '../src/art/ui/index.js';
    import { getCharacterSprite } from '../src/art/sprites/index.js';
    import { getTileSprite, getObjectSprite, getEdgeSprite } from '../src/art/tiles/index.js';
    import { TILE_TYPES } from '../src/data/tiles.js';
    import { TileMap } from '../src/world/TileMap.js';
    import { WeddingConfetti } from '../src/rendering/WeddingConfetti.js';
    import { ChimeWaves } from '../src/rendering/ChimeWaves.js';
    import { QUIRKS } from '../src/data/social.js';

    const root = document.getElementById('root');
    const SCALE = 5;

    function show(title, items, scale = SCALE) {
      const h = document.createElement('h2');
      h.textContent = title;
      const row = document.createElement('div');
      row.className = 'row';
      for (const [label, sprite] of items) {
        const fig = document.createElement('figure');
        const c = document.createElement('canvas');
        c.width = sprite.width * scale;
        c.height = sprite.height * scale;
        const ctx = c.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(sprite, 0, 0, c.width, c.height);
        const cap = document.createElement('figcaption');
        cap.textContent = `${label} (${sprite.width}x${sprite.height})`;
        fig.append(c, cap);
        row.append(fig);
      }
      root.append(h, row);
    }

    const SEASONS = ['spring', 'summer', 'autumn', 'winter'];
    const NAMES = { spring: 'ilkbahar', summer: 'yaz', autumn: 'sonbahar', winter: 'kış' };

    // --- 20. aşama: Ulu Saat Kulesi, Altın Çağ, prestij peyzajı ---
    show('Ulu Saat Kulesi: Temel, Gövde, Mekanizma & Çan (gece, çan odası yanık)', [1, 2, 3].map((st) => [['Temel', 'Gövde', 'Mekanizma & Çan'][st - 1], getStructureSprite('wonder', { wonderStage: st, windowsLit: st === 3, frame: 1 })]), 3);
    {
      const tower = getStructureSprite('wonder', { wonderStage: 3, windowsLit: false, frame: 0 });
      const frames = [0.3, 1.1, 2.2].map((t) => {
        const canvas = document.createElement('canvas');
        canvas.width = 200;
        canvas.height = 160;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#4a9a46';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(tower, 68, canvas.height - tower.height - 8);
        const waves = new ChimeWaves();
        waves.startedAt = 0;
        const fakeTower = { x: 68, y: canvas.height - 8 - 64, height: 64 };
        waves.draw({ fillRect: (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }, drawImage: (img, x, y) => ctx.drawImage(img, x, y) }, fakeTower, t);
        return [`${t} sn`, canvas];
      });
      show('Kule saati çalınca (08:00 / 18:00): çan odasından yayılan altın ses dalgaları ve yükselen notalar', frames, 2);
    }
    show('Prestij peyzajı: Mermer Çeşme (dört kare, fışkıran su) ve Altın Çağ Feneri (gündüz / gece)', [
      ...[0, 1, 2, 3].map((f) => [`mermer çeşme ${f}`, getStructureSprite('marbleFountain', { frame: f })]),
      ['altın fener gündüz', getStructureSprite('goldenLantern', { lit: false })],
      ['altın fener gece', getStructureSprite('goldenLantern', { lit: true })],
    ], 5);
    show('Yeni simgeler: Kadim Dişli (dişliler), Ulu Saat Kulesi; kule çanı balonu', [['gears', getIconSprite('gears')], ['wonder', getIconSprite('wonder')], ['bell', getIconSprite('bell')], ['çan balonu', getBubbleSprite('bell')]], 8);

    // --- 19. aşama: sosyal yaşam — huy simgeleri, yeni balonlar, düğün konfetisi ve küçük sahneler ---
    /** Küçük bir sahne: [sprite, x, y] listesini (ayak tabanı y) verilen boyutta bir tuvale çizer; isteğe bağlı çizim kancası. */
    function scene(w, h, layers, extra = null) {
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#4a9a46';
      ctx.fillRect(0, 0, w, h);
      for (const [sprite, x, y] of layers) ctx.drawImage(sprite, Math.round(x), Math.round(y - sprite.height));
      if (extra) extra(ctx);
      return canvas;
    }
    const pixelRenderer = (ctx) => ({ fillRect: (x, y, w, h, color) => { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); } });
    const socialLooks = [
      { hair: 'long', hairColor: 'auburn', skin: 'light', shirt: 'rose', pants: 'navy' },
      { hair: 'short', hairColor: 'black', skin: 'tan', shirt: 'forest', pants: 'brown' },
      { hair: 'bun', hairColor: 'blonde', skin: 'light', shirt: 'sky', pants: 'plum' },
      { hair: 'spiky', hairColor: 'brown', skin: 'medium', shirt: 'mustard', pants: 'denim' },
      { hair: 'hat', hairColor: 'ginger', skin: 'light', shirt: 'red', pants: 'denim' },
    ];
    show('Karakter huyları: Hayvansever (pati), Kitap Kurdu (kitap), Müzisyen (ud), Doğa Tutkunu (yaprak)', Object.entries(QUIRKS).map(([key, q]) => [`${q.name}`, getIconSprite(q.icon)]), 10);
    show('Yeni balonlar: dedikodu / haber fısıltısı, müzisyenin melodisi, kitap, pati; aşk, yüzük ve kalp', ['whisper', 'melody', 'book', 'paw', 'love', 'ring', 'heart', 'note'].map((n) => [n, getBubbleSprite(n)]), 8);
    {
      const fountain = getStructureSprite('fountain', {});
      const confetti = new WeddingConfetti();
      const frames = [0.4, 1.2, 3, 6.5].map((t) => {
        const party = { x: 64, y: 70, startedAt: 1 };
        confetti.startKey = party.startedAt; // kutlama 0. saniyede başlamış sayılır
        confetti.startTime = 0;
        return [`${t} sn`, scene(128, 112, [[fountain, 64 - fountain.width / 2, 86], [getCharacterSprite(socialLooks[0], 'down', 'idle0'), 46, 100], [getCharacterSprite(socialLooks[1], 'down', 'idle1'), 72, 100], [getBubbleSprite('ring'), 44, 82], [getBubbleSprite('ring'), 72, 82]], (ctx) => {
          confetti.draw(pixelRenderer(ctx), party, t);
        })];
      });
      show('Düğün kutlaması: meydan havuzunun üstünde konfeti demeti, süzülen kâğıtlar ve yükselen kalpler (zamanla)', frames, 3);
    }
    {
      const bench = getStructureSprite('bench', {});
      const cat = getCatSprite('sit', 'left', 0);
      show('Sosyal yaşam sahneleri: bankta yan yana randevu, fener altında kitap okuyan, kedi okşayan Hayvansever, akşam çalan Müzisyen', [
        ['bank randevusu', scene(80, 56, [[bench, 14, 44], [bench, 46, 44], [getCharacterSprite(socialLooks[2], 'down', 'sit0'), 16, 44], [getCharacterSprite(socialLooks[4], 'down', 'sit1'), 48, 44], [getBubbleSprite('love'), 17, 26], [getBubbleSprite('heart'), 49, 26]])],
        ['fener altında kitap', scene(64, 56, [[getStructureSprite('lantern', { lit: true }), 8, 46], [bench, 30, 44], [getCharacterSprite(socialLooks[3], 'down', 'sit0'), 32, 44], [getBubbleSprite('book'), 33, 26]])],
        ['kedi okşayan', scene(64, 48, [[getCharacterSprite(socialLooks[1], 'right', 'idle0'), 18, 40], [cat, 32, 40], [getBubbleSprite('heart'), 19, 22], [getBubbleSprite('paw'), 34, 26]])],
        ['müzisyen ve dinleyenler', scene(96, 56, [[getCharacterSprite(socialLooks[0], 'down', 'idle0'), 42, 44], [getBubbleSprite('melody'), 43, 26], [getCharacterSprite(socialLooks[2], 'right', 'idle1'), 16, 48], [getBubbleSprite('note'), 17, 30], [getCharacterSprite(socialLooks[3], 'left', 'idle0'), 68, 48], [getBubbleSprite('note'), 69, 30]])],
        ['dedikodu: yolda selamlaşma', scene(64, 48, [[getCharacterSprite(socialLooks[4], 'right', 'walk0'), 18, 42], [getCharacterSprite(socialLooks[1], 'left', 'walk1'), 32, 42], [getBubbleSprite('whisper'), 19, 24], [getBubbleSprite('whisper'), 33, 24]])],
      ], 4);
    }

    // --- 18. aşama: serbest imar, peyzaj fırçası ve kasaba estetiği ---
    /** Gerçek TileMap kuralıyla (kenar geçişleri + otomatik yol köşeleri, isteğe bağlı çamur) çizilen küçük harita. */
    function roadMosaic(rows, season = 'summer', wet = false) {
      const legend = { '.': 'grass', ',': 'meadow', F: 'forest', '#': 'path', '=': 'cobble', P: 'plaza', ':': 'sand' };
      const map = new TileMap(rows[0].length, rows.length);
      rows.forEach((row, y) => [...row].forEach((ch, x) => map.set(x, y, legend[ch], (x * 3 + y) % 2)));
      const canvas = document.createElement('canvas');
      canvas.width = map.width * 16;
      canvas.height = map.height * 16;
      const ctx = canvas.getContext('2d');
      const renderer = { width: canvas.width, height: canvas.height, drawImage: (img, x, y) => ctx.drawImage(img, x, y) };
      const camera = { getViewBounds: () => ({ left: 0, top: 0, right: canvas.width, bottom: canvas.height }) };
      map.renderGround(renderer, camera, 0, season, { wet });
      return canvas;
    }
    const ROADS = [
      '..........,,,,',
      '.####.....,,,,',
      '.#..#######,,,',
      '.#..#..=..#,,,',
      '.####..=..#...',
      '....#==PPP=====',
      '....#..PPP#...F',
      '....#..PPP#..FF',
      '.......=..#.FFF',
    ].map((r) => r.slice(0, 15).padEnd(15, '.'));
    show('Yol & Zemin fırçası: toprak patika, parke taş yol ve taş plaka meydan; virajlar ve kavşaklar otomatik köşelenir (yaz, sonbahar, kış)', ['summer', 'autumn', 'winter'].map((sn) => [NAMES[sn], roadMosaic(ROADS, sn)]), 3);
    show('Yağmurda toprak patika çamurlanır (parke ve taş plaka çamurlanmaz)', [['kuru', roadMosaic(ROADS.slice(0, 6))], ['yağmurda', roadMosaic(ROADS.slice(0, 6), 'summer', true)]], 3);
    show('Zemin fırçaları (tek karo)', [
      ['Toprak Patika', getTileSprite('path', 0, 0)],
      ['Parke Taş Yol', getTileSprite('cobble', 0, 0)],
      ['Taş Plaka', getTileSprite('plaza', 0, 0)],
      ['yol simgesi', getIconSprite('road')],
      ['peyzaj simgesi', getIconSprite('flower')],
      ['çit simgesi', getIconSprite('fence')],
      ['tabela simgesi', getIconSprite('signpost')],
      ['estetik simgesi', getIconSprite('aesthetic')],
    ], 5);
    /** Çit düzeni: her çit dört yanındaki çite / kapıya göre birleşir (StructureSystem.connectFences kuralı). */
    function fenceLayout(rows) {
      const h = rows.length;
      const w = rows[0].length;
      const canvas = document.createElement('canvas');
      canvas.width = w * 16;
      canvas.height = h * 16 + 8;
      const ctx = canvas.getContext('2d');
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) ctx.drawImage(getTileSprite('grass', 0, 0), x * 16, y * 16 + 8);
      const isFence = (x, y) => rows[y] && (rows[y][x] === 'f' || rows[y][x] === 'g');
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const ch = rows[y][x];
          if (ch !== 'f' && ch !== 'g') continue;
          const connect = { left: isFence(x - 1, y), right: isFence(x + 1, y), up: isFence(x, y - 1), down: isFence(x, y + 1) };
          const sprite = getStructureSprite(ch === 'f' ? 'woodFence' : 'fenceGate', { connect });
          ctx.drawImage(sprite, x * 16, (y + 1) * 16 + 8 - sprite.height);
        }
      }
      return canvas;
    }
    show('Ahşap Çit ve Çit Kapısı: yönüne göre birleşir (köşe, T, dört yol); kapı çitin yönünü alır', [
      ['ağıl', fenceLayout(['ffgff', 'f...f', 'f...g', 'fffff'])],
      ['T ve kavşak', fenceLayout(['..f..', 'ffgff', '..f..', '..f..'])],
      ['tek çit', getStructureSprite('woodFence', {})],
      ['yatay kapı', getStructureSprite('fenceGate', { connect: { left: true, right: true } })],
      ['dikey kapı', getStructureSprite('fenceGate', { connect: { up: true, down: true } })],
    ], 4);
    show('Sokak eşyaları: demir fener (gündüz / gece), ahşap fener, mahalle tabelası, park bankı, çiçek saksısı', [
      ['demir fener gündüz', getStructureSprite('ironLantern', { lit: false })],
      ['demir fener gece', getStructureSprite('ironLantern', { lit: true })],
      ['demir fener kış', getStructureSprite('ironLantern', { lit: true, season: 'winter' })],
      ['ahşap fener gece', getStructureSprite('lantern', { lit: true })],
      ['mahalle tabelası', getStructureSprite('signpost', {})],
      ['tabela kış', getStructureSprite('signpost', { season: 'winter' })],
      ['park bankı', getStructureSprite('parkBench', {})],
      ['ahşap bank', getStructureSprite('bench', {})],
      ...[0, 1, 2].map((tone) => [`saksı ${tone}`, getStructureSprite('planter', { tone, frame: tone % 2 })]),
    ], 6);
    for (const kind of ['birchTree', 'oakTree', 'pineTree']) {
      const names = { birchTree: 'Huş', oakTree: 'Meşe', pineTree: 'Çam' };
      show(`Süs ağacı: ${names[kind]} — fidan, genç ağaç, ulu ağaç ve dört mevsim`, [
        ['fidan', getStructureSprite(kind, { growthStage: 0 })],
        ['genç', getStructureSprite(kind, { growthStage: 1 })],
        ...SEASONS.map((season) => [`ulu · ${NAMES[season]}`, getStructureSprite(kind, { growthStage: 2, season })]),
      ], 5);
    }

    // --- 16. aşama: keşif seferleri: üzüm asması, kadim meşale, ganimet ve macera simgeleri, balonlar ---
    show('Üzüm Asması (seferden gelen egzotik fide; bahçe / çardak kenarına dikilir): dört mevsim', SEASONS.map((season) => [NAMES[season], getStructureSprite('grapeVine', { season })]), 6);
    show('Kadim Meşale: gündüz (soluk köz), gece mavi alev üç kare, kışın', [
      ['gündüz', getStructureSprite('ancientTorch', { lit: false })],
      ...[0, 1, 2].map((frame) => [`gece kare ${frame}`, getStructureSprite('ancientTorch', { lit: true, frame })]),
      ['kış gecesi', getStructureSprite('ancientTorch', { lit: true, frame: 1, season: 'winter' })],
    ], 6);
    show('Keşif simgeleri: maceralar (dağ, dere, tapınak), ganimetler (fide, meşale, harita, yadigâr parçası), kadim yazıt ve imar şeması, maceracı', ['mountain', 'river', 'temple', 'firefly', 'vineSeed', 'ancientTorch', 'cityMap', 'relicShard', 'inscription', 'scheme', 'adventure'].map((n) => [n, getIconSprite(n)]), 10);
    show('Balonlar: maceracı hikâyesi (dağ) ve hazine', ['adventure', 'treasure'].map((n) => [n, getBubbleSprite(n)]), 8);

    // --- 15. aşama: meslek kıyafetleri (Çırak sade, Kalfa aksesuar, Usta tam kostüm), zanaat rozetleri, usta işi eserler ---
    {
      const KITS = [
        ['lumberjack', 'Oduncu'], ['farmer', 'Çiftçi'], ['miner', 'Madenci / Taşçı'], ['healer', 'Şifacı'], ['baker', 'Fırıncı / Aşçı'],
        ['shepherd', 'Çoban'], ['fisher', 'Balıkçı'], ['builder', 'Yapı Ustası'], ['artisan', 'Zanaatkâr'], ['scholar', 'Bilge'],
      ];
      const person = { hair: 'short', hairColor: 'brown', skin: 'medium', shirt: 'teal', pants: 'navy' };
      const look = (outfit, extra = {}) => ({ child: false, coat: false, bag: false, outfit, ...extra });
      for (const [kit, name] of KITS) {
        show(`Meslek kıyafeti: ${name} (Çırak · Kalfa · Usta; Usta arkadan, yandan, yürürken ve paltolu)`, [
          ['Çırak', getCharacterSprite(person, 'down', 'idle0', look(null))],
          ['Kalfa', getCharacterSprite(person, 'down', 'idle0', look(`${kit}:2`))],
          ['Kalfa yandan', getCharacterSprite(person, 'right', 'walk0', look(`${kit}:2`))],
          ['Usta', getCharacterSprite(person, 'down', 'idle0', look(`${kit}:3`))],
          ['Usta arkadan', getCharacterSprite(person, 'up', 'walk1', look(`${kit}:3`))],
          ['Usta yandan', getCharacterSprite(person, 'right', 'walk0', look(`${kit}:3`))],
          ['Usta sola', getCharacterSprite(person, 'left', 'idle0', look(`${kit}:3`))],
          ['Usta oturur', getCharacterSprite(person, 'down', 'sit0', look(`${kit}:3`))],
          ['Usta paltolu', getCharacterSprite(person, 'down', 'idle0', look(`${kit}:3`, { coat: true }))],
        ], 6);
      }
      const people = [
        { hair: 'long', hairColor: 'blonde', skin: 'light', shirt: 'rose', pants: 'denim' },
        { hair: 'spiky', hairColor: 'black', skin: 'deep', shirt: 'mustard', pants: 'brown' },
        { hair: 'bun', hairColor: 'auburn', skin: 'tan', shirt: 'lavender', pants: 'navy' },
      ];
      show('Usta kostümleri farklı sakinlerde (saç, ten, giysi rengi)', people.flatMap((p, i) =>
        ['lumberjack', 'miner', 'healer', 'baker'].map((kit) => [`${i + 1}: ${kit}`, getCharacterSprite(p, 'down', 'idle0', look(`${kit}:3`))])
      ), 6);
      show('Zanaat rozetleri ve usta işi eserler (simgeler)', ['badgeBronze', 'badgeSilver', 'badgeGold', 'masterpiece', 'handshake', 'mwChest', 'mwFigure', 'mwStatue', 'mwLoaf', 'mwRug', 'mwElixir'].map((n) => [n, getIconSprite(n)]), 10);
      show('Balonlar: barışma (el sıkışma) ve usta işi eser', ['handshake', 'masterpiece'].map((n) => [n, getBubbleSprite(n)]), 8);
    }

    // --- 14. aşama: mevsim festivallerinin süslemeleri, kervan teknesi, yeni simgeler ve anı balonu ---
    show('Mevsim festivali süslemeleri: Çiçek Şenliği (kemer, sepet), Panayır (sofra, flama iki kare), Hasat Bayramı (dev sepet, kabak, şıra fıçısı)', [
      ['çiçek kemeri', getFestivalDecorSprite('flowerArch')],
      ['çiçek sepeti', getFestivalDecorSprite('flowerBasket')],
      ['ziyafet sofrası', getFestivalDecorSprite('feastTable')],
      ...[0, 1].map((f) => [`flama ${f}`, getFestivalDecorSprite('flagPole', { frame: f })]),
      ['hasat sepeti', getFestivalDecorSprite('harvestBasket')],
      ['kabak', getFestivalDecorSprite('pumpkin')],
      ['şıra fıçısı', getFestivalDecorSprite('ciderBarrel')],
    ], 5);
    show('Işıklar Gecesi: kardan adam üç kademede yükselir; Çiçek Şenliği saç çiçekleri', [
      ...[0, 1, 2].map((stage) => [`kardan adam ${stage + 1}/3`, getFestivalDecorSprite('snowman', { stage })]),
      ...[0, 1, 2].map((v) => [`saç çiçeği ${v + 1}`, getFlowerCrownSprite(v)]),
    ], 8);
    show('Büyük İhracat Seferi: kervan teknesi (altın şeritli yelken), boş / yüklü, sola giden', [
      ...[0, 1].map((f) => [`kervan ${f}`, getBoatSprite('right', false, f, true)]),
      ['kervan yüklü', getBoatSprite('right', true, 0, true)],
      ['sola, yüklü', getBoatSprite('left', true, 1, true)],
    ], 6);
    show('Yeni simgeler: dört festival, toplanma zili, sabah sisi, gök gürültülü fırtına; anı balonu', [
      ...['blossom', 'sunfair', 'harvest', 'snowman', 'bell', 'mist', 'thunder'].map((n) => [n, getIconSprite(n)]),
      ['anı balonu', getBubbleSprite('memory')],
    ], 10);

    // --- 13. aşama: peyzaj, kasaba yadigârları, lüks mallar ve yeni arayüz simgeleri ---
    show('Kiraz Çiçeği Ağacı (1x1): ilkbahar, yaz, sonbahar, kış (yaprakları oyunda rüzgârla savrulur)', SEASONS.map((season) => [NAMES[season], getStructureSprite('cherryTree', { season })]), 6);
    show('Ahşap Çardak (2x2): tam görünüm, oyundaki iki katman (arka: döşeme ve banklar / ön: direkler ve çatı), kış', [
      ['çardak', getStructureSprite('gazebo', {})],
      ['arka katman', getGazeboLayer('back')],
      ['ön katman', getGazeboLayer('front')],
      ['kış', getStructureSprite('gazebo', { season: 'winter' })],
    ], 4);
    show('Mermer Kemer (1x1, altından geçilir) ve Çiçekli Çit (yanındakilerle birleşir)', [
      ['kemer', getStructureSprite('marbleArch', {})],
      ['kemer kış', getStructureSprite('marbleArch', { season: 'winter' })],
      ['çit tek', getStructureSprite('flowerFence', {})],
      ['sol uç', getStructureSprite('flowerFence', { connect: { right: true } })],
      ['orta', getStructureSprite('flowerFence', { connect: { left: true, right: true } })],
      ['sağ uç', getStructureSprite('flowerFence', { connect: { left: true } })],
      ['dikey', getStructureSprite('flowerFence', { connect: { up: true, down: true } })],
      ['köşe', getStructureSprite('flowerFence', { connect: { right: true, down: true } })],

    /** Elle dizilmiş küçük bir karo haritası: biyom geçişleri oyundaki gibi (TileMap kuralı) çizilir. */
    function mosaic(rows, season) {
      const legend = { '.': 'grass', ',': 'meadow', '^': 'rocky', F: 'forest', '#': 'path', ':': 'sand', '~': 'water' };
      const h = rows.length;
      const w = rows[0].length;
      const canvas = document.createElement('canvas');
      canvas.width = w * 16;
      canvas.height = h * 16;
      const ctx = canvas.getContext('2d');
      const at = (x, y) => (rows[y] && rows[y][x] ? legend[rows[y][x]] : null);
      const offsets = [[0, -1], [1, 0], [0, 1], [-1, 0]];
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const name = at(x, y);
          ctx.drawImage(getTileSprite(name, (x * 3 + y) % 2, 0, season), x * 16, y * 16);
          const overlays = [].concat(TILE_TYPES[name].edgeOverlay ?? []);
          offsets.forEach(([dx, dy], dir) => {
            const n = at(x + dx, y + dy);
            if (season === 'winter' && n && TILE_TYPES[name].ground && TILE_TYPES[n].ground) return;
            const overlay = n && overlays.find((o) => o.neighbors.includes(n));
            if (overlay) ctx.drawImage(getEdgeSprite(overlay.sprite, dir, 0, season), x * 16, y * 16);
          });
        }
      }
      return canvas;
    }

      '..,,,,..#..F',
      '.,,,,,,.#...',
      ':,,,,,,,#,..',
      '~:,,,,,,#,,.',
    ];
    show('Biyom geçişleri (kayalık, çimen, orman, bereketli toprak, yol, kıyı)', SEASONS.map((s) => [NAMES[s], mosaic(PATCH, s)]), 3);
